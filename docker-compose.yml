services:
  app:
    build: ./docker/php
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      - mysql
      - mongo

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # les fichiers SQL sont lancés au premier démarrage
      - ./database/mysql:/docker-entrypoint-initdb.d

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: mysql
    ports:
      - "127.0.0.1:8091:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
  mongo_data:
